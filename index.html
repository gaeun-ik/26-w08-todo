<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f3">
  <meta name="description" content="오늘 해야 할 일을 가볍게 정리하는 To-Do 리스트">
  <title>오늘의 목록 | To-Do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app-shell container py-4 py-md-5">
    <div class="dashboard mx-auto">
      <header class="dashboard-header">
        <div class="d-flex flex-wrap align-items-start justify-content-between gap-3">
          <div>
            <p class="eyebrow mb-2"><span class="eyebrow-dot" aria-hidden="true"></span> MY DAILY NOTES</p>
            <h1 class="app-title mb-2">오늘의 목록<span class="title-period">.</span></h1>
            <p class="today-date mb-0" id="today-date"></p>
          </div>
          <div class="progress-summary text-md-end">
            <span class="summary-label">오늘의 진행률</span>
            <div class="d-flex align-items-baseline gap-2 justify-content-md-end">
              <strong class="progress-value" id="progress-value">0%</strong>
              <span class="progress-caption" id="progress-caption">0개 중 0개 완료</span>
            </div>
          </div>
        </div>
        <div class="progress progress-track mt-4" role="progressbar" aria-label="오늘의 할 일 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
        </div>
      </header>

      <section class="composer-section" aria-labelledby="composer-heading">
        <div class="section-heading-row mb-3">
          <div>
            <p class="section-kicker mb-1">CAPTURE A THOUGHT</p>
            <h2 class="section-title mb-0" id="composer-heading">새 할 일</h2>
          </div>
          <span class="input-counter" id="input-counter" aria-live="polite">0 / 50</span>
        </div>
        <form id="todo-form" class="composer-form">
          <label class="visually-hidden" for="todo-input">할 일 내용</label>
          <input class="form-control todo-input" id="todo-input" name="text" type="text" maxlength="50" placeholder="예: 좋아하는 빵집에 들르기" autocomplete="off" required>
          <label class="visually-hidden" for="importance-select">중요도</label>
          <select class="form-select importance-select" id="importance-select" name="importance">
            <option value="high">높음</option>
            <option value="medium" selected>보통</option>
            <option value="low">낮음</option>
          </select>
          <button class="btn add-button" type="submit"><span aria-hidden="true">+</span> 추가</button>
        </form>
        <p class="form-hint mb-0 mt-2">짧게 적어도 괜찮아요. 최대 50자까지 기록할 수 있어요.</p>
      </section>

      <section class="list-section" aria-labelledby="list-heading">
        <div class="list-toolbar">
          <div>
            <p class="section-kicker mb-1">YOUR TASKS</p>
            <h2 class="section-title mb-0" id="list-heading">할 일 모아보기</h2>
          </div>
          <div class="btn-group filter-group" role="group" aria-label="할 일 필터">
            <button class="btn filter-button is-active" type="button" data-filter="all" aria-pressed="true">전체</button>
            <button class="btn filter-button" type="button" data-filter="active" aria-pressed="false">진행 중</button>
            <button class="btn filter-button" type="button" data-filter="completed" aria-pressed="false">완료</button>
          </div>
        </div>

        <div class="empty-state text-center" id="empty-state" hidden>
          <div class="empty-illustration" aria-hidden="true">✦ <span>☀</span> ✦</div>
          <p class="empty-title mb-1">오늘의 할 일을 추가해 보세요! ✨</p>
          <p class="empty-copy mb-0">작은 한 가지부터 시작해도 충분해요.</p>
        </div>
        <div class="empty-state text-center" id="no-results" hidden>
          <div class="empty-illustration empty-illustration-muted" aria-hidden="true">○</div>
          <p class="empty-title mb-0">해당하는 할 일이 없어요.</p>
        </div>

        <section class="task-group" id="active-group" aria-labelledby="active-heading" hidden>
          <div class="group-heading">
            <h3 class="group-title" id="active-heading">진행 중</h3>
            <span class="group-count" id="active-count">0</span>
          </div>
          <ul class="task-list list-unstyled mb-0" id="active-list"></ul>
        </section>
        <section class="task-group completed-group" id="completed-group" aria-labelledby="completed-heading" hidden>
          <div class="group-heading">
            <h3 class="group-title" id="completed-heading">완료</h3>
            <span class="group-count" id="completed-count">0</span>
          </div>
          <ul class="task-list list-unstyled mb-0" id="completed-list"></ul>
        </section>
        <p class="visually-hidden" id="status-message" role="status" aria-live="polite"></p>
      </section>

      <footer class="dashboard-footer">
        <span>오늘도 나에게 맞는 속도로</span>
        <span class="footer-mark" aria-hidden="true">✳</span>
      </footer>
    </div>
  </main>
</body>
</html>
